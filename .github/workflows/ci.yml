name: Core CI

on:
  push:
    branches: [main, release-cleanup]
  pull_request:
    branches: [main]

jobs:
  core-build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore core tests
        run: dotnet restore tests/KinectStation.Core.SmokeTests/KinectStation.Core.SmokeTests.csproj

      - name: Build core tests
        run: dotnet build tests/KinectStation.Core.SmokeTests/KinectStation.Core.SmokeTests.csproj --configuration Release --no-restore

      - name: Run core smoke tests
        run: dotnet run --project tests/KinectStation.Core.SmokeTests --configuration Release --no-build
